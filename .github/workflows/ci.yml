name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validacion del repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Front-matter, IDs y manifiesto
        run: python tools/gestion/validate_repo.py

      - name: Manifiesto actualizado
        run: python tools/gestion/build_manifest.py --check

      - name: Esquemas JSON validos
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path("schemas").glob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
          print("esquemas OK")
          PY

  tests:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest tools/tests -q

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown:
    name: Lint de Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
